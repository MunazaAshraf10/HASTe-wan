[haste]
backend = 'xattention'
engine = 'cuda'
mode = 'tmr'
threshold = 0.9
block = 128
stride = 8
queries = 300
keys = 1000
iterations = 50
updates = 2
minimum = 0.1
seed = 17
layers = 'all'
# gate = [0.1, 0.9]  # optional Section 4.2 layer-level refresh gating
table = ''

[calibration]
thresholds = [0.85, 0.9, 0.95]
intervals = 4
seed = 23
weights = [1.0, 0.5, 0.01, 0.01]
cutoff = 0.25

[model]
name = 'Wan-AI/Wan2.2-Animate-2-14B-Diffusers'
revision = '7d48412d7b903ff3a89f4f5a960d99e1899605a1'
height = 320
width = 480
steps = 40
frames = 81
fps = 24
guidance = 3.0

[run]
# One warmup and one timed generation per mode; no trace or counter passes.
manifest = 'experiments/manifest.jsonl'
output = 'results'
devices = [0]
warmup = 1
repeats = 1
split = 'dev'
diagnostics = false
