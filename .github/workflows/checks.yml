name: Validation

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      cuda:
        description: Run acceptance tests on a registered H100 runner
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  reference:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          version: '0.11.28'
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run ty check
      - run: uv run pytest -m 'not cuda'
  cuda:
    if: github.event_name == 'workflow_dispatch' && inputs.cuda
    runs-on: [self-hosted, linux, x64, h100]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          version: '0.11.28'
      - run: uv sync --locked
      - run: nvidia-smi
      - run: uv run pytest -m cuda
